# .github/workflows/ci-pr-gates.yml — stage 6: PR + CI gates, then swarm dispatch
# v4.6: checkout fetch-depth 0 in the gates job (bug #22).
# v4.5: gitleaks-action v2 now requires GITHUB_TOKEN passed explicitly (breaking
# change); TEST/LINT/COVERAGE command vars get fallbacks so an unset repo var
# cannot blank out run: (GitHub rejects expression-only run: when it is empty).
# v4.3: added npm ci install step (pack bug #14 — runners had no node_modules).
# v4.1 fixes: GH_TOKEN context (was github.GITHUB_TOKEN — invalid, always empty);
# swarm dispatch now targets the ONE parameterized review-agent.yml with a persona
# input (the pack dispatched three workflow files that don't exist); ticket_key and
# risk_tier are read from packet.json instead of "<from packet>" placeholders;
# reviewed-* labels are cleared before re-dispatch so aggregation never fires on
# stale state (PDF stage-7 fix sequence step 7); dispatches serialized (Kimi rate
# limits, PDF stage 7 note).
name: ci-pr-gates
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0   # gitleaks diffs base^..head; depth-1 clone lacks the base
                           # commit -> "unknown revision" and a failed scan (bug #22)
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: ${{ vars.TEST_COMMAND || 'npm test' }}   # must pass; flaky = blocked

      - name: Lint + format
        run: ${{ vars.LINT_COMMAND || 'npm run lint' }}

      - name: Coverage floor
        run: |
          ${{ vars.COVERAGE_COMMAND || 'npm run coverage' }} || true
          python scripts/check_coverage_floor.py --min 70

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2        # fail on any leak in diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required by gitleaks-action v2 (breaking change)

      - name: Diff-size cap
        # >600 changed lines (excluding generated/tests/lockfiles) => auto-blocked
        run: python scripts/check_diff_size.py --max-lines 600

      - name: Scope guard
        # Agent may only touch what its plan declared. Parses PR body "modules:"
        # list and diffs against actual changed paths.
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: python scripts/check_scope.py --pr ${{ github.event.pull_request.number }}

  metadata:
    needs: gates
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build review metadata packet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          python scripts/build_review_packet.py             --pr ${{ github.event.pull_request.number }}             --repo-registry repo-registry.yaml > packet.json
          cat packet.json

      - name: Post packet as PR comment (updated in place)
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: python scripts/post_packet_comment.py --pr ${{ github.event.pull_request.number }}

      - name: Clear stale reviewed-* labels before re-arming the swarm
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          python scripts/clear_review_labels.py --pr ${{ github.event.pull_request.number }}

      - name: Dispatch review swarm (stage 7, serialized for rate limits)
        env:
          DISPATCH_TOKEN: "${{ secrets.DISPATCH_TOKEN }}"
        run: |
          TICKET=$(jq -r .ticket_key packet.json)
          TIER=$(jq -r .risk_tier packet.json)
          for persona in functional security standards; do
            curl -sf -X POST -H "Authorization: Bearer $DISPATCH_TOKEN"               -H "Accept: application/vnd.github+json"               https://api.github.com/repos/${{ github.repository }}/actions/workflows/review-agent.yml/dispatches               -d "{\"ref\":\"main\",\"inputs\":{\"pr_number\":\"${{ github.event.pull_request.number }}\",\"ticket_key\":\"$TICKET\",\"persona\":\"$persona\",\"risk_tier\":\"$TIER\"}}"
            sleep 20   # Kimi Code rate limits: serialize the three dispatches (PDF stage 7)
          done
