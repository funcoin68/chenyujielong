# .github/workflows/stage3-respond.yml — reacts to human JIRA comments (Q&A loop)
# v4.1 fixes: round cap off-by-one (<=3, matching "max 3 rounds" in the PDF),
# Kimi Code endpoint + model pinned.
name: stage3-respond
on:
  workflow_dispatch:
    inputs:
      ticket_key: { required: true, type: string }
      round:      { required: true, type: string }

permissions: { contents: read }

jobs:
  respond:
    if: ${{ fromJSON(inputs.round) <= 3 }}    # rounds 1-3 allowed; 4+ never dispatched (Jira rule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i -g @anthropic-ai/claude-code

      - name: Fetch ticket + full comment thread
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          python scripts/fetch_ticket.py "${{ inputs.ticket_key }}" --with-comments > /tmp/ticket.json
          python scripts/assemble_context.py /tmp/ticket.json --with-qa > /tmp/context.md

      - name: "Run agent: answer questions / revise proposal (k3, plan mode)"
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.ai/coding
          ANTHROPIC_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          claude -p --model "${{ vars.FRONTIER_MODEL || 'k3' }}"             --permission-mode plan             --append-system-prompt "$(cat agent/proposal-instructions.md)
          You are in ROUND ${{ inputs.round }} of a clarification exchange (max 3).
          The human answers since your last proposal are in the context.
          Answer remaining open questions, then post a REVISED proposal with
          changed sections marked. If still ambiguous after this round, say
          EXPLICITLY that human refinement is needed."             "$(cat /tmp/context.md)" > /tmp/out.txt

      - name: Post response to JIRA
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ vars.JIRA_USER_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/post_proposal.py /tmp/out.txt             --ticket "${{ inputs.ticket_key }}" --round "${{ inputs.round }}"             --notify-slack "${{ vars.PROPOSAL_REVIEW_CHANNEL }}"
          # post_proposal.py: open questions resolved -> status Proposal ready;
          # round >= 3 and still ambiguous -> Needs human refinement, stop.
